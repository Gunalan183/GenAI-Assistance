services:
  # Backend API
  - type: web
    name: linkedin-analyzer-backend
    runtime: python
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Frontend - Static Site
  - type: static
    name: linkedin-analyzer-frontend
    buildCommand: bash build-frontend.sh
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://genai-assistance-1.onrender.com/api
